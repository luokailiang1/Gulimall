server:
  port: 8007
spring:
  application:
      name: gulimall-third-party
  config:
    import[0]: nacos:oss.property?group=dev-group
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: 7583d6a2-3c98-4b15-9afe-71ffbedb3c3f
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 7583d6a2-3c98-4b15-9afe-71ffbedb3c3f
      username: nacos
      password: nacos

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always